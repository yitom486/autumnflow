<!DOCTYPE html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/icon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutumnFlow</title>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('autumnflow_theme_v1') || localStorage.getItem('acp_studio_theme_v1') || 'dark';
          var doc = document.documentElement;
          doc.setAttribute('data-theme', t);
          if (t === 'light') {
            doc.classList.remove('dark');
            doc.classList.add('light');
          } else {
            doc.classList.add('dark');
            doc.classList.remove('light');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-background text-foreground antialiased selection:bg-signal/30 overflow-hidden font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
