name: Release (Windows, macOS, Linux)

# 打 tag 即发版，例如：git tag v1.0.0 && git push origin v1.0.0
# 说明：取自 CHANGELOG.md 对应版本小节（scripts/release-notes.ts）。
# 产物：Windows NSIS、macOS DMG/ZIP、Linux AppImage/DEB，自动挂到同一个 GitHub Release。
# 当前默认未签名：Windows 可能提示 SmartScreen，macOS 可能提示无法验证开发者。
# 如需正式分发，请分别配置 Windows 代码签名与 macOS Developer ID/notarization secrets。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            platform: win
            package_script: package:win
            artifacts: |
              release/*.exe
              release/*.blockmap
              release/latest.yml
          - name: macOS
            os: macos-latest
            platform: mac
            package_script: package:mac
            artifacts: |
              release/*.dmg
              release/*.zip
              release/latest-mac.yml
          - name: Linux
            os: ubuntu-latest
            platform: linux
            package_script: package:linux
            artifacts: |
              release/*.AppImage
              release/*.deb
              release/latest-linux.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Typecheck (app + server + shared + desktop)
        run: bun run typecheck

      - name: Unit & integration tests
        run: bunx vitest run

      - name: Web build
        run: bun run build

      - name: Electron bundle
        run: bun run build:electron

      - name: Package ${{ matrix.platform }}
        run: bun run ${{ matrix.package_script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 发布说明 = CHANGELOG 里与 tag 同版本的小节；找不到就让发版失败
      - name: Release notes from CHANGELOG
        run: bun scripts/release-notes.ts "${{ github.ref_name }}" --out release-notes.md

      # 渐进式发布：各平台打包完成立即挂到 GitHub Release，杜绝被慢/排队的 runner 阻塞
      - name: Publish ${{ matrix.name }} to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.artifacts }}
          fail_on_unmatched_files: true
          body_path: release-notes.md

      - name: Upload ${{ matrix.platform }} artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error

