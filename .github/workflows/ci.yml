name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Typecheck (app + server + shared + desktop)
        run: bun run typecheck

      - name: Unit & integration tests
        run: bunx vitest run

      - name: Web build
        run: bun run build

      - name: Electron bundle check
        run: bun run build:electron

      - name: Desktop runtime staging check
        run: bun run stage:desktop

  e2e:
    # The Electron shell has no other coverage: the universal suite exercises
    # the gateway in-process. This job is the only place the packaged shell,
    # the tray/background policy and the real HTTP surface are exercised.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Electron E2E
        run: bun run test:e2e
        env:
          # The dev-window spec needs an interactive Windows desktop to assert
          # on visible native windows; it is skipped on CI by the spec itself.
          CI: "true"
